name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked --release

      - name: Package binary
        run: |
          cd target/release
          tar czf ../../wam-${{ github.ref_name }}-x86_64-linux.tar.gz wam

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes wam-*.tar.gz
