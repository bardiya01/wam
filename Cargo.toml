[package]
name = "wam-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A simple CLI/TUI web-app manager"
repository = "https://github.com/bardiya01/wam.git"
homepage = "https://github.com/bardiya01/wam.git"
documentation = "https://github.com/bardiya01/wam.git"
keywords = ["cli"]

[[bin]]
name = "wam"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
url = "2.5.8"
